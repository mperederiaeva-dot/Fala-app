<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fala Português — Уровень А1</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #f4f6f9);
            --text: var(--tg-theme-text-color, #1c1c1e);
            --card: var(--tg-theme-secondary-bg-color, #ffffff);
            --accent: #009c3b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            padding-bottom: 80px;
        }
        .header {
            background: linear-gradient(135deg, #009c3b, #006827);
            color: white;
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(0,156,59,0.2);
        }
        .header h1 { margin: 0; font-size: 20px; }
        .header p { margin: 6px 0 0; font-size: 13px; opacity: 0.9; }
        
        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 16px;
        }
        .tab-btn {
            background: var(--card);
            color: var(--text);
            border: 1px solid rgba(0,0,0,0.08);
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }
        .tab-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .grammar-box {
            border-left: 4px solid var(--accent);
            background: rgba(0, 156, 59, 0.08);
            padding: 12px;
            border-radius: 0 12px 12px 0;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 16px;
        }
        .word-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }
        .word-item:last-child { border-bottom: none; }
        .pt-word { font-size: 16px; font-weight: 700; color: var(--accent); }
        .transcription { font-size: 13px; color: #555; font-style: italic; }
        .ru-word { font-size: 14px; opacity: 0.8; margin-top: 2px; }
        .speak-btn {
            background: #e8f5e9;
            color: #009c3b;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .custom-tts {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .custom-tts input {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #ccc;
            font-size: 15px;
        }
        .custom-tts button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🇧🇷 Fala Português (Уровень А1)</h1>
        <p>Базовый курс: грамматика, словарь и озвучка pt-BR</p>
    </div>

    <!-- Навигация -->
    <div class="tabs" id="tabs"></div>

    <!-- Контент -->
    <div id="content"></div>

    <!-- Озвучка любой фразы -->
    <div class="card">
        <strong>🎧 Озвучить любую фразу (pt-BR):</strong>
        <div class="custom-tts">
            <input type="text" id="customText" placeholder="Например: Pão de queijo...">
            <button onclick="speakCustom()">🔊</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) tg.expand();

        const modules = [
            {
                tab: "1. База и О себе",
                title: "Модуль 1: Местоимения, Ser, Estar и Знакомство",
                grammar: `<b>Грамматика А1 (База):</b><br>
• <b>Местоимения:</b> <i>eu</i> (э́у — я), <i>você</i> (восэ́ — ты/Вы), <i>ele/ela</i> (э́ли/э́ла — он/она).<br>
• <b>SER (постоянное):</b> <i>sou</i> (соу — я есть), <i>é</i> (э — он/она есть).<br>
• <b>ESTAR (временное, место):</b> <i>estou</i> (эшто́у — я нахожусь), <i>está</i> (эшта́ — он/она находится).<br>
• <b>Отрицание:</b> <b>não</b> (на̃́у) ставится перед глаголом.`,
                phrases: [
                    { pt: "Olá! Eu sou da Rússia.", tr: "ола́! э́у соу да ру́сия", ru: "Привет! Я из России." },
                    { pt: "Eu estou bem, obrigado(a).", tr: "э́у што́у бэйн, обраги́ду" },
                    { pt: "Como você se chama?", tr: "ко́му восэ́ се ша́ма?", ru: "Как тебя зовут?" },
                    { pt: "Eu não falo muito bem.", tr: "э́у на̃́у фа́лу му́йту бэйн", ru: "Я не говорю очень хорошо." },
                    { pt: "Pode falar mais devagar?", tr: "по́де фала́р ма́ис девага́р?", ru: "Можете говорить медленнее?" }
                ]
            },
            {
                tab: "2. Дом и Семья",
                title: "Модуль 2: Семья, дом и глагол TER",
                grammar: `<b>Грамматика А1 (Иметь и Род):</b><br>
• <b>TER (иметь):</b> <i>tenho</i> (тэ́нью — у меня есть).<br>
• <b>Род и артикли:</b> <b>o</b> (мужской), <b>a</b> (женский).<br>
• <b>Множественное число:</b> добавление -s (например, <i>casa</i> — <i>casas</i>).<br>
• <b>Предлоги:</b> <i>em</i> (в/на), <i>de</i> (из/от), <i>para</i> (для/в направлении).`,
                phrases: [
                    { pt: "Eu tenho uma família.", tr: "э́у тэ́нью у́ма фами́лия", ru: "У меня есть семья." },
                    { pt: "Meu filho, minha casa.", tr: "ме́у фи́лью, ми́нья ка́за", ru: "Мой сын, мой дом." },
                    { pt: "Nós moramos em Curitiba.", tr: "но́ш мора́муш эйн курити́ба", ru: "Мы живем в Куритибе." },
                    { pt: "Onde fica o meu apartamento?", tr: "о́нджи фи́ка о ме́у апартаме́нту?", ru: "Где находится моя квартира?" }
                ]
            },
            {
                tab: "3. Магазин и Еда",
                title: "Модуль 3: Покупки, еда и вопросы",
                grammar: `<b>Грамматика А1 (Вопросы и цены):</b><br>
• <b>Вопросительные слова:</b> <i>quanto</i> (сколько?), <i>onde</i> (где?), <i>quando</i> (когда?).<br>
• <b>Основные действия:</b> <i>querer</i> (хотеть), <i>comprar</i> (покупать), <i>comer</i> (есть), <i>beber</i> (пить).<br>
• <b>Характеристики:</b> дорогой (caro), дешевый (barato), хороший (bom), плохой (ruim).`,
                phrases: [
                    { pt: "Quanto custa isto?", tr: "куа́нту ку́ста и́шту?", ru: "Сколько это стоит?" },
                    { pt: "Eu quero comprar pão de queijo.", tr: "э́у ке́ру компра́р па́ун ди ке́йжу", ru: "Я хочу купить сырный хлеб." },
                    { pt: "Tem frutas frescas?", tr: "тэ́йн фру́таш фре́шкаш?", ru: "Есть свежие фрукты?" },
                    { pt: "Pode ser no Pix?", tr: "по́де се́р ну пикс?", ru: "Можно оплатить через Pix?" }
                ]
            },
            {
                tab: "4. Время и Числа",
                title: "Модуль 4: Числа, время и будущее",
                grammar: `<b>Грамматика А1 (Время и планы):</b><br>
• <b>Числа:</b> от 0 до 100.<br>
• <b>Дни недели:</b> segunda-feira, terça-feira и т.д.<br>
• <b>Ближайшее будущее (Ir + инфинитив):</b> <i>vou comprar</i> (во́у компра́р — я собираюсь купить), <i>vai trabalhar</i> (он/она собирается работать).`,
                phrases: [
                    { pt: "Que horas são?", tr: "ке о́раш са́ун?", ru: "Который час?" },
                    { pt: "São duas horas da tarde.", tr: "са́ун ду́аш о́раш да та́рди", ru: "Сейчас два часа дня." },
                    { pt: "Hoje é segunda-feira.", tr: "о́жи э сегу́нда фе́йра", ru: "Сегодня понедельник." },
                    { pt: "Amanhã eu vou estudar português.", tr: "аманя́ э́у во́у штуда́р португе́ш", ru: "Завтра я буду (собираюсь) учить португальский." }
                ]
            }
        ];

        let activeIndex = 0;

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'pt-BR';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Озвучка не поддерживается на этом устройстве");
            }
        }

        function speakCustom() {
            const val = document.getElementById('customText').value.trim();
            if (val) speak(val);
        }

        function render() {
            const tabsEl = document.getElementById('tabs');
            tabsEl.innerHTML = modules.map((m, idx) => 
                `<button class="tab-btn ${idx === activeIndex ? 'active' : ''}" onclick="selectTab(${idx})">${m.tab}</button>`
            ).join('');

            const current = modules[activeIndex];
            const contentEl = document.getElementById('content');
            contentEl.innerHTML = `
                <div class="card">
                    <h2 style="margin-top:0; font-size:18px;">${current.title}</h2>
                    <div class="grammar-box">${current.grammar}</div>
                    <div>
                        ${current.phrases.map(p => `
                            <div class="word-item">
                                <div>
                                    <div class="pt-word">${p.pt}</div>
                                    <div class="transcription">[ ${p.tr} ]</div>
                                    <div class="ru-word">${p.ru}</div>
                                </div>
                                <button class="speak-btn" onclick="speak('${p.pt.replace(/'/g, "\\'")}')">🔊</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function selectTab(idx) {
            activeIndex = idx;
            render();
        }

        render();
    </script>
</body>
</html>
