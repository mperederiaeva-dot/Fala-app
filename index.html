<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fala Português — А1-А2</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #f4f6f9);
            --text: var(--tg-theme-text-color, #1c1c1e);
            --card: var(--tg-theme-secondary-bg-color, #ffffff);
            --accent: #009c3b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            padding-bottom: 80px;
        }
        .header {
            background: linear-gradient(135deg, #009c3b, #006827);
            color: white;
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(0,156,59,0.2);
        }
        .header h1 { margin: 0; font-size: 20px; }
        .header p { margin: 6px 0 0; font-size: 13px; opacity: 0.9; }
        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 16px;
        }
        .tab-btn {
            background: var(--card);
            color: var(--text);
            border: 1px solid rgba(0,0,0,0.08);
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }
        .tab-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .grammar-box {
            border-left: 4px solid var(--accent);
            background: rgba(0, 156, 59, 0.08);
            padding: 12px;
            border-radius: 0 12px 12px 0;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 16px;
        }
        .word-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }
        .word-item:last-child { border-bottom: none; }
        .pt-word { font-size: 16px; font-weight: 700; color: var(--accent); }
        .ru-word { font-size: 14px; opacity: 0.8; margin-top: 2px; }
        .speak-btn {
            background: #e8f5e9;
            color: #009c3b;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .custom-tts {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .custom-tts input {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #ccc;
            font-size: 15px;
        }
        .custom-tts button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🇧🇷 Fala Português (A1–A2)</h1>
        <p>Интерактивный курс: грамматика, темы и произношение</p>
    </div>

    <div class="tabs" id="tabs"></div>
    <div id="content"></div>

    <div class="card">
        <strong>🎧 Озвучить любую фразу (pt-BR):</strong>
        <div class="custom-tts">
            <input type="text" id="customText" placeholder="Например: Pão de queijo...">
            <button onclick="speakCustom()">🔊</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) tg.expand();

        const modules = [
            {
                tab: "1. О себе и Числа",
                title: "Модуль 1: Знакомство и счет",
                grammar: "<b>Грамматика А1:</b><br>• <b>Ser</b> (постоянное): <i>Eu sou</i> (Я есть), <i>Você é</i> (Ты/Вы есть).<br>• <b>Estar</b> (временное): <i>Eu estou bem</i> (Я в порядке).<br>• <b>Отрицание:</b> ставим <b>não</b> перед глаголом.",
                phrases: [
                    { pt: "Olá, tudo bem?", ru: "Привет, всё хорошо?" },
                    { pt: "Eu sou da Rússia", ru: "Я из России" },
                    { pt: "Eu moro em Curitiba", ru: "Я живу в Куритибе" },
                    { pt: "Eu não falo muito bem ainda", ru: "Я еще говорю не очень хорошо" },
                    { pt: "Um, dois, três, quatro, cinco", ru: "1, 2, 3, 4, 5" },
                    { pt: "Seis, sete, oito, nove, dez", ru: "6, 7, 8, 9, 10" }
                ]
            },
            {
                tab: "2. Время и День",
                title: "Модуль 2: Время и расписание",
                grammar: "<b>Грамматика А1-А2:</b><br>• Настоящее время: <i>Eu trabalho</i> (я работаю), <i>Você trabalha</i>.<br>• Ближайшее будущее: глагол <b>Ir + инфинитив</b> (<i>Eu vou comprar</i> — я собираюсь купить).",
                phrases: [
                    { pt: "Que horas são?", ru: "Который час?" },
                    { pt: "São duas horas da tarde", ru: "Сейчас два часа дня" },
                    { pt: "Hoje de manhã", ru: "Сегодня утром" },
                    { pt: "Amanhã eu vou estudar", ru: "Завтра я буду учиться" },
                    { pt: "Segunda-feira, terça-feira", ru: "Понедельник, вторник" }
                ]
            },
            {
                tab: "3. Рынок и Покупки",
                title: "Модуль 3: Супермаркет и предлоги",
                grammar: "<b>Грамматика А1-А2:</b><br>• Артикли: <b>o / a</b> (опред.), <b>um / uma</b> (неопред.).<br>• Слияние предлогов: <b>em + o = no</b> (в), <b>de + a = da</b> (из/от).",
                phrases: [
                    { pt: "Quanto custa isso?", ru: "Сколько это стоит?" },
                    { pt: "Tem frutas frescas hoje?", ru: "Сегодня есть свежие фрукты?" },
                    { pt: "Eu quero meio quilo de queijo", ru: "Я хочу полкило сыра" },
                    { pt: "Vou pagar no cartão de crédito", ru: "Я оплачу кредитной картой" },
                    { pt: "Pode ser no Pix?", ru: "Можно оплатить по Pix?" }
                ]
            },
            {
                tab: "4. Город и Кафе",
                title: "Модуль 4: В городе и ресторане",
                grammar: "<b>Грамматика А2:</b><br>• Вопросы: <b>Onde?</b> (Где?), <b>Como?</b> (Как?), <b>Quanto?</b> (Сколько?).<br>• Вежливая форма: <i>Eu gostaria de...</i> (Я бы хотел/а...).",
                phrases: [
                    { pt: "Onde fica a farmácia mais próxima?", ru: "Где ближайшая аптека?" },
                    { pt: "Uma mesa para dois, por favor", ru: "Столик на двоих, пожалуйста" },
                    { pt: "Eu gostaria de um café com leite", ru: "Я бы хотел(а) кофе с молоком" },
                    { pt: "A conta, por favor", ru: "Счет, пожалуйста" },
                    { pt: "Muito obrigada!", ru: "Большое спасибо! (от женщины)" }
                ]
            }
        ];

        let activeIndex = 0;

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'pt-BR';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Озвучка не поддерживается на этом устройстве");
            }
        }

        function speakCustom() {
            const val = document.getElementById('customText').value.trim();
            if (val) speak(val);
        }

        function render() {
            const tabsEl = document.getElementById('tabs');
            tabsEl.innerHTML = modules.map((m, idx) => 
                `<button class="tab-btn ${idx === activeIndex ? 'active' : ''}" onclick="selectTab(${idx})">${m.tab}</button>`
            ).join('');

            const current = modules[activeIndex];
            const contentEl = document.getElementById('content');
            contentEl.innerHTML = `
                <div class="card">
                    <h2 style="margin-top:0; font-size:18px;">${current.title}</h2>
                    <div class="grammar-box">${current.grammar}</div>
                    <div>
                        ${current.phrases.map(p => `
                            <div class="word-item">
                                <div>
                                    <div class="pt-word">${p.pt}</div>
                                    <div class="ru-word">${p.ru}</div>
                                </div>
                                <button class="speak-btn" onclick="speak('${p.pt.replace(/'/g, "\\'")}')">🔊</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function selectTab(idx) {
            activeIndex = idx;
            render();
        }

        render();
    </script>
</body>
</html>
